# Build scripts explicitly declined: none of them is needed at install time.
# Declaring them (instead of leaving pnpm to guess) keeps `pnpm test` from
# failing on the ignored-builds check.
allowBuilds:
  '@google/genai': false
  esbuild: false
  protobufjs: false
overrides:
  brace-expansion@1: 1.1.18
  brace-expansion@5: 5.0.9
  protobufjs@>=7.5.0: ^7.6.5
