# Build scripts explicitly declined: pi-cursor needs none of them at install
# time. Declaring them (instead of leaving pnpm to guess) keeps `pnpm test`
# from failing on the ignored-builds check.
allowBuilds:
  '@google/genai': false
  esbuild: false
  protobufjs: false

# pnpm 11 reads the dependency cooldown from this file, not from .npmrc, and
# defaults it to 1440 minutes. ADR 012 removed the cooldown, so it is set to
# zero here, in every project, because the root does not reach the packages.
minimumReleaseAge: 0
