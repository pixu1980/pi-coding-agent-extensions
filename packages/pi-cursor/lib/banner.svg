<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="banner-title banner-description" data-theme="local-agent-routing" viewBox="0 0 1792 592"><title id="banner-title">pi-cursor - Cursor agents inside pi, on your own API key</title><desc id="banner-description">A pi terminal handing a prompt to a Cursor agent running locally in the working directory, with the model catalog and the API key shown beside it.</desc><defs><linearGradient id="cursor-bg" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#0d1020"/><stop offset="1" stop-color="#090b14"/></linearGradient><pattern id="cursor-grid" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#6ee7f0" fill-opacity=".16"/></pattern><marker id="cursor-arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="10" refY="6" viewBox="0 0 12 12"><path fill="#6ee7f0" d="m0 0 12 6-12 6z"/></marker></defs><g id="background"><path fill="url(#cursor-bg)" d="M0 0h1792v592H0z"/><path fill="#6ee7f0" d="M0 0h18v592H0z"/><path fill="#a78bfa" d="M18 0h5v592h-5z"/></g><g id="grid"><path fill="url(#cursor-grid)" d="M24 0h1768v592H24z"/><path stroke="#6ee7f0" stroke-opacity=".11" d="M72 92h670M72 500h670"/></g><g id="artwork" font-family="'IBM Plex Mono',monospace"><rect width="404" height="360" x="88" y="110" fill="#0b1220" stroke="#5b6478" stroke-width="2" rx="8"/><path stroke="#6ee7f0" stroke-width="2" d="M88 158h404"/><text x="112" y="142" fill="#8b93a7" font-size="15" letter-spacing="2">PI / TERMINAL</text><g font-size="16"><text x="112" y="196" fill="#6ee7f0">$</text><text x="134" y="196" fill="#eef1f8">/model cursor</text><text x="112" y="232" fill="#a78bfa">&gt;</text><text x="134" y="232" fill="#c8cfe0">default · Auto</text><text x="112" y="268" fill="#6ee7f0">$</text><text x="134" y="268" fill="#eef1f8">cursor &quot;add a test&quot;</text></g><rect width="356" height="130" x="112" y="300" fill="#101a2e" stroke="#39435a" stroke-width="1.5" rx="6"/><g fill="#9aa4ba" font-size="14"><text x="128" y="328">▸ read  src/_models.ts</text><text x="128" y="352">▸ edit  src/_models.ts</text><text x="128" y="376">▸ shell pnpm test</text><text x="128" y="400" fill="#6ee7f0">✓ 166 passing</text></g><path stroke="#6ee7f0" stroke-dasharray="7 6" stroke-width="2" marker-end="url(#cursor-arrow)" d="M500 290h84"/><rect width="336" height="250" x="600" y="164" fill="#101126" stroke="#a78bfa" stroke-width="2" rx="8"/><path stroke="#a78bfa" stroke-width="2" d="M600 212h336"/><text x="624" y="196" fill="#a78bfa" font-size="15" letter-spacing="2">CURSOR AGENT / LOCAL</text><g font-size="15"><text x="624" y="252" fill="#c8cfe0">cwd</text><text x="700" y="252" fill="#8b93a7">.</text><text x="624" y="286" fill="#c8cfe0">tools</text><text x="700" y="286" fill="#8b93a7">own shell · read · edit</text><text x="624" y="320" fill="#c8cfe0">stream</text><text x="700" y="320" fill="#8b93a7">text · thinking · usage</text><text x="624" y="354" fill="#c8cfe0">egress</text><text x="700" y="354" fill="#8b93a7">cursor hosts only</text></g><text x="624" y="392" fill="#ffb86b" font-size="13" letter-spacing="2">NO REPO UPLOAD · NO MCP BRIDGE</text></g><g id="typography" font-family="'IBM Plex Mono','JetBrains Mono',monospace"><text x="984" y="182" fill="#6ee7f0" font-size="18" letter-spacing="6">PI EXTENSION / PROVIDER</text><text x="976" y="306" fill="#eef1f8" font-size="84" font-weight="700" letter-spacing="-6">pi-cursor</text><text x="984" y="363" fill="#8b93a7" font-size="24" letter-spacing="2">YOUR KEY. YOUR MACHINE. CURSOR MODELS.</text></g><g id="metadata" font-family="'IBM Plex Mono',monospace"><path stroke="#6ee7f0" stroke-opacity=".42" d="M984 424h626"/><g fill="#c8cfe0" font-size="15" letter-spacing="2"><text x="984" y="463">API KEY</text><text x="1112" y="463">MODELS</text><text x="1232" y="463">LOCAL</text><text x="1330" y="463">THINKING</text><text x="1464" y="463">/CURSOR-MODELS</text></g><text x="984" y="508" fill="#a78bfa" font-size="14" letter-spacing="4">CACHED CATALOG · SCRUBBED ERRORS · OFFLINE AWARE</text><path fill="#6ee7f0" d="M1640 496h26l12 12-12 12h-26l12-12z"/></g></svg>