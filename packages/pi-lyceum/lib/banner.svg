<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="banner-title banner-description" data-theme="model-gateway" viewBox="0 0 1792 592"><title id="banner-title">pi-lyceum - Lyceum open models inside pi, on your own API key</title><desc id="banner-description">A pi terminal logging in to Lyceum beside a gateway box that lists the OpenAI-compatible endpoint, the live model catalog and the reasoning levels it forwards.</desc><defs><linearGradient id="lyceum-bg" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#07130f"/><stop offset="1" stop-color="#050a09"/></linearGradient><pattern id="lyceum-grid" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#22d3ee" fill-opacity=".14"/></pattern><marker id="lyceum-arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="10" refY="6" viewBox="0 0 12 12"><path fill="#fbbf24" d="m0 0 12 6-12 6z"/></marker></defs><g id="background"><path fill="url(#lyceum-bg)" d="M0 0h1792v592H0z"/><path fill="#22d3ee" d="M0 0h18v592H0z"/><path fill="#fbbf24" d="M18 0h5v592h-5z"/></g><g id="grid"><path fill="url(#lyceum-grid)" d="M24 0h1768v592H24z"/><path stroke="#22d3ee" stroke-opacity=".11" d="M72 92h620M72 500h620"/></g><g id="artwork" font-family="'IBM Plex Mono',monospace"><rect width="404" height="360" x="72" y="110" fill="#0a1a15" stroke="#4a6058" stroke-width="2" rx="8"/><path stroke="#22d3ee" stroke-width="2" d="M72 158h404"/><text x="96" y="142" fill="#7f9a90" font-size="15" letter-spacing="2">PI / TERMINAL</text><g font-size="16"><text x="96" y="196" fill="#fbbf24">$</text><text x="118" y="196" fill="#eef7f2">/login lyceum</text><text x="96" y="232" fill="#22d3ee">&gt;</text><text x="118" y="232" fill="#c3d6cd">key stored in auth.json</text><text x="96" y="268" fill="#fbbf24">$</text><text x="118" y="268" fill="#eef7f2">/model lyceum</text></g><rect width="356" height="130" x="96" y="300" fill="#0d241d" stroke="#355044" stroke-width="1.5" rx="6"/><g fill="#a9c2b7" font-size="14"><text x="112" y="328">▸ reasoning / off · low · high</text><text x="112" y="352">▸ tools / function calling</text><text x="112" y="376">▸ images / where offered</text><text x="112" y="400" fill="#22d3ee">✓ streaming over SSE</text></g><path stroke="#fbbf24" stroke-dasharray="7 6" stroke-width="2" marker-end="url(#lyceum-arrow)" d="M492 290h72"/><rect width="376" height="262" x="580" y="158" fill="#0c1a24" stroke="#22d3ee" stroke-width="2" rx="8"/><path stroke="#22d3ee" stroke-width="2" d="M580 206h376"/><text x="604" y="190" fill="#22d3ee" font-size="15" letter-spacing="2">LYCEUM / OPENAI-COMPATIBLE</text><g font-size="15"><text x="604" y="244" fill="#c3d6cd">base url</text><text x="712" y="244" fill="#7f9a90">api.lyceum.technology</text><text x="604" y="278" fill="#c3d6cd">catalog</text><text x="712" y="278" fill="#7f9a90">GET /models · live refresh</text><text x="604" y="312" fill="#c3d6cd">thinking</text><text x="712" y="312" fill="#7f9a90">reasoning_effort</text><text x="604" y="346" fill="#c3d6cd">billing</text><text x="712" y="346" fill="#7f9a90">per token · cached input</text></g><text x="604" y="388" fill="#fbbf24" font-size="13" letter-spacing="2">ONE KEY · ONE ENDPOINT · NO PROXY</text></g><g id="typography" font-family="'IBM Plex Mono','JetBrains Mono',monospace"><text x="1020" y="182" fill="#22d3ee" font-size="18" letter-spacing="6">PI EXTENSION / PROVIDER</text><text x="1012" y="306" fill="#eef7f2" font-size="84" font-weight="700" letter-spacing="-6">pi-lyceum</text><text x="1020" y="363" fill="#7f9a90" font-size="24" letter-spacing="2">OPEN MODELS. YOUR KEY. ONE API.</text></g><g id="metadata" font-family="'IBM Plex Mono',monospace"><path stroke="#22d3ee" stroke-opacity=".42" d="M1020 424h578"/><g fill="#c3d6cd" font-size="15" letter-spacing="2"><text x="1020" y="463">LOGIN</text><text x="1104" y="463">CATALOG</text><text x="1204" y="463">STREAMING</text><text x="1322" y="463">THINKING</text><text x="1432" y="463">/LYCEUM-MODELS</text></g><text x="1020" y="508" fill="#fbbf24" font-size="14" letter-spacing="4">ALLOWLISTED EGRESS · NO SECRET LOGGING · OFFLINE CATALOG</text><path fill="#22d3ee" d="M1618 496h26l12 12-12 12h-26l12-12z"/></g></svg>
