<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="banner-title banner-description" data-theme="terminal-telemetry" viewBox="0 0 1792 592"><title id="banner-title">pi-statusline - terminal telemetry</title><desc id="banner-description">A compact terminal instrument panel visualizes git, model, context, and MCP status in two live lines.</desc><defs><linearGradient id="status-bg" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#0a1413"/><stop offset=".54" stop-color="#091010"/><stop offset="1" stop-color="#0d0e0d"/></linearGradient><pattern id="status-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path fill="none" stroke="#51f0a5" stroke-opacity=".045" d="M16 0H0v16"/></pattern><filter id="status-glow"><feGaussianBlur result="b" stdDeviation="4"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g id="background"><path fill="url(#status-bg)" d="M0 0h1792v592H0z"/><path fill="#51f0a5" d="M0 0h18v592H0z"/><path fill="#f8d34f" d="M18 0h5v592h-5z"/></g><g id="grid"><path fill="url(#status-grid)" d="M24 0h1768v592H24z"/><path stroke="#51f0a5" stroke-opacity=".14" d="M80 94h664M80 498h664"/></g><g id="artwork" font-family="'IBM Plex Mono',monospace"><rect width="612" height="336" x="92" y="122" fill="#070c0b" stroke="#345c4c" stroke-width="2" rx="10"/><path stroke="#345c4c" d="M92 168h612"/><circle cx="120" cy="145" r="6" fill="#ff6b64"/><circle cx="142" cy="145" r="6" fill="#f8d34f"/><circle cx="164" cy="145" r="6" fill="#51f0a5"/><text x="120" y="215" fill="#7f9d91" font-size="14" letter-spacing="2">LIVE / PROJECT TELEMETRY</text><rect width="556" height="72" x="120" y="244" fill="#102019" stroke="#51f0a5" stroke-opacity=".5" rx="4"/><text x="142" y="275" fill="#d9f9e9" font-size="16">pi-ext  <tspan fill="#51f0a5">main*</tspan>  gpt-5.6  <tspan fill="#f8d34f">high</tspan></text><text x="142" y="300" fill="#7f9d91" font-size="13">context</text><rect width="248" height="8" x="224" y="290" fill="#26352f" rx=