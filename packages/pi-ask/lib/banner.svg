ers it</text><text x="112" y="464" fill="#748077" font-size="13" letter-spacing="2">1-9 SELECT · N NOTE · ENTER CONFIRM · ESC CANCEL</text><rect width="148" height="30" x="528" y="448" rx="4" fill="#1b2517" stroke="#d8ff72" stroke-width="2"/><text x="543" y="469" fill="#d8ff72" font-size="14">ENTER ✓</text></g><g id="typography" font-family="'IBM Plex Mono','JetBrains Mono',monospace"><text x="808" y="182" fill="#d8ff72" font-size="18" letter-spacing="6">PI EXTENSION / 03</text><text x="800" y="306" fill="#f4f8eb" font-size="84" font-weight="700" letter-spacing="-6">pi-ask</text><text x="808" y="363" fill="#a7afa4" font-size="24" letter-spacing="2">QUESTIONS, ANSWERED IN THE TERMINAL.</text></g><g id="metadata" font-family="'IBM Plex Mono',monospace"><path stroke="#d8ff72" stroke-opacity=".42" d="M808 424h802"/><g fill="#d1d8cb" font-size="15" letter-spacing="2"><text x="808" y="463">ASK</text><text x="930" y="463">INTERVIEW</text><text x="1122" y="463">WAVES</text><text x="1304" y="463">NOTES</text><text x="1494" y="463">/ASK</text></g><text x="808" y="508" fill="#ff754a" font-size="14" letter-spacing="4">ASK / INTERVIEW / MULTI-WAVE QUESTIONNAIRES</text><path fill="#d8ff72" d="M1640 496h26l12 12-12 12h-26l12-12z"/></g></svg>
